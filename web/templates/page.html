<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/markdown.css">
<link rel="stylesheet" href="/assets/chroma.css">
	<link rel="stylesheet" href="/assets/vendor/katex.min.css">
	<link rel="stylesheet" href="/user.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="brand"><img class="brand-icon" src="/assets/favicon.svg" alt="" width="20" height="20">{{.BrandName}} <span class="brand-version">{{.Version}}</span></span>
      <button id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
    <div class="tree-controls">
      <input id="filter" type="search" placeholder="Filter files…" autocomplete="off" spellcheck="false">
      <button id="expand-all" type="button" title="Expand all" aria-label="Expand all"><svg class="ctrl-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 6 8 2.5 11.5 6"/><path d="M4.5 10 8 13.5 11.5 10"/></svg></button>
      <button id="collapse-all" type="button" title="Collapse all" aria-label="Collapse all"><svg class="ctrl-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 2.5 8 6l3.5-3.5"/><path d="M4.5 13.5 8 10l3.5 3.5"/></svg></button>
    </div>
    <nav id="tree" aria-label="File tree"></nav>
  </aside>
  <div id="resizer" title="Drag to resize"></div>
  <main id="main">
    <header id="breadcrumb">{{.BreadcrumbHTML}}</header>
    <article id="content" class="markdown-body">{{.ContentHTML}}</article>
  </main>
  <nav id="toc" aria-label="Table of contents">{{.TOCHTML}}</nav>
</div>
<div id="reload-status" hidden>reconnecting…</div>
<div id="media-zoom" hidden role="dialog" aria-modal="true" aria-label="Zoom view">
  <button id="media-zoom-close" type="button" title="Close" aria-label="Close">
    <svg class="media-zoom-x" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
  </button>
  <div id="media-zoom-viewport">
    <div id="media-zoom-canvas"></div>
  </div>
</div>
<script>
  window.GFMVIEW = {
    initialPath: {{.InitialPathJSON}},
    reload: {{.Reload}},
    tree: {{.TreeJSON}},
    rootPaths: {{.RootPathsJSON}}
  };
</script>
	<script defer src="/assets/vendor/katex.min.js"></script>
	<script defer src="/assets/vendor/auto-render.min.js"></script>
	<script defer src="/assets/vendor/mermaid.min.js"></script>
	<script defer src="/assets/app.js"></script>
</body>
</html>
